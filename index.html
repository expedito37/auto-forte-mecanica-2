<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auto Forte Mecânica</title>
  <meta name="description" content="Oficina mecânica completa: revisão, freios, suspensão, injeção, ar-condicionado e mais." />

  <!-- Fontes: Barlow Condensed (títulos) e Barlow (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== CABEÇALHO: zap, endereço e redes (preenchidos pelo script.js) ===== -->
  <header class="cabecalho" id="topo">
    <div class="faixa-topo">
      <div class="container faixa-topo__linha">
        <a id="topoZap" class="faixa-topo__item" href="#" target="_blank" rel="noopener"></a>
        <span id="topoEndereco" class="faixa-topo__item"></span>
        <nav id="topoRedes" class="faixa-topo__redes" aria-label="Redes sociais"></nav>
      </div>
    </div>

    <div class="container barra-menu">
      <a href="#topo" class="logo" id="logoNome"></a>
      <button class="menu-botao" id="menuBotao" aria-label="Abrir menu" aria-expanded="false">☰</button>
      <nav class="menu" id="menu" aria-label="Menu principal"></nav>
    </div>
  </header>

  <main>
    <!-- ===== HERO: carrossel com 4 imagens ===== -->
    <section class="hero" aria-label="Destaques">
      <div class="hero__slides" id="heroSlides"></div>
      <button class="hero__seta hero__seta--esq" id="heroAnterior" aria-label="Slide anterior">‹</button>
      <button class="hero__seta hero__seta--dir" id="heroProximo" aria-label="Próximo slide">›</button>
      <div class="hero__pontos" id="heroPontos"></div>
    </section>

    <!-- ===== DESTAQUES (faixa de números) ===== -->
    <section class="destaques" aria-label="Números da oficina">
      <div class="container destaques__grade" id="destaques"></div>
    </section>

    <!-- ===== SOBRE ===== -->
    <section class="secao" id="sobre">
      <div class="container sobre">
        <div class="sobre__imagens">
          <img id="sobreImgGrande" class="sobre__img-grande" alt="Mecânico trabalhando no motor" />
          <img id="sobreImgPequeno" class="sobre__img-pequeno" alt="Oficina equipada" />
        </div>
        <div>
          <h2 id="sobreTitulo"></h2>
          <p id="sobreTexto" class="sobre__texto"></p>
          <ul class="valores" id="sobreValores"></ul>
        </div>
      </div>
    </section>

    <!-- ===== SERVIÇOS: 8 cards ===== -->
    <section class="secao secao--cinza" id="servicos">
      <div class="container">
        <h2 id="servicosTitulo"></h2>
        <p id="servicosSubtitulo" class="secao__sub"></p>
        <div class="cards" id="servicosCards"></div>

        <!--
        ====================================================================
        TABELA DE PREÇOS ESTILO PLANILHA GOOGLE (DESATIVADA)
        Para ativar: tire este comentário aqui, no styles.css e no script.js.
        ====================================================================
        <div class="planilha" id="planilha">
          <div class="planilha__titulo">Tabela de preços</div>
          <div class="planilha__rolagem">
            <table class="planilha__tabela" id="planilhaTabela"></table>
          </div>
        </div>
        -->
      </div>
    </section>

    <!-- ===== COMO FUNCIONA ===== -->
    <section class="secao" id="como">
      <div class="container">
        <h2 id="comoTitulo"></h2>
        <ol class="passos" id="comoPassos"></ol>
      </div>
    </section>

    <!-- ===== DEPOIMENTOS ===== -->
    <section class="secao secao--escura" id="depoimentos">
      <div class="container">
        <h2 id="depTitulo"></h2>
        <div class="depoimentos" id="depLista"></div>
      </div>
    </section>

    <!-- ===== CONTATO + MAPA GOOGLE ===== -->
    <section class="secao" id="contato">
      <div class="container">
        <h2 id="contatoTitulo"></h2>
        <div class="contato">
          <div class="contato__info" id="contatoInfo"></div>
          <div class="contato__mapa">
            <iframe id="mapa" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== RODAPÉ ===== -->
  <footer class="rodape">
    <div class="container rodape__linha">
      <span id="rodapeDireitos"></span>
      <nav id="rodapeRedes" class="faixa-topo__redes" aria-label="Redes sociais"></nav>
    </div>
  </footer>

  <!-- ===== BOTÕES FLUTUANTES ===== -->
  <a id="zapFlutuante" class="zap-flutuante" href="#" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path fill="#fff" d="M16 3C9.4 3 4 8.3 4 14.9c0 2.3.7 4.5 1.9 6.3L4 29l8-1.9c1.2.6 2.600 1 4 1 6.600 0 12-5.300 12-11.900S22.600 3 16 3zm0 21.800c-1.300 0-2.600-.4-3.700-1l-.5-.3-4.700 1.100 1.200-4.500-.3-.5a9.700 9.700 0 0 1-1.500-5.200C6.500 9.800 10.800 5.500 16 5.500s9.500 4.300 9.500 9.500-4.300 9.800-9.500 9.800zm5.300-7.300c-.3-.1-1.700-.8-1.900-.9-.3-.1-.5-.1-.7.100-.2.300-.7.900-.9 1.100-.2.200-.3.200-.6.100-1.700-.8-2.800-1.500-3.900-3.400-.3-.5.300-.5.800-1.500.1-.2 0-.4 0-.5l-.9-2.100c-.2-.5-.4-.5-.7-.5h-.6c-.2 0-.5.100-.8.400-.3.300-1 1-1 2.500s1.100 2.900 1.200 3.100c.1.200 2.100 3.200 5.100 4.500 1.900.8 2.600.9 3.600.7.600-.1 1.700-.7 2-1.400.2-.7.2-1.200.2-1.400-.1-.1-.3-.2-.6-.3z"/></svg>
  </a>
  <button id="voltarTopo" class="voltar-topo" aria-label="Voltar ao topo">↑</button>

  <script src="script.js"></script>
</body>
</html>
